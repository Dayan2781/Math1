<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Дасгал</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; padding: 1rem; background: #fff; color: #111; font-size: 15px; }
.topic-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1rem; }
.chip { font-size: 12px; padding: 4px 10px; border-radius: 20px; border: 1px solid #ccc; background: #f5f5f5; cursor: pointer; }
.chip.active { background: #dbeafe; color: #1d4ed8; border-color: #93c5fd; }
.diff-row { display: flex; gap: 8px; align-items: center; margin-bottom: 1rem; font-size: 13px; color: #555; }
select { font-size: 13px; padding: 4px 8px; border-radius: 6px; border: 1px solid #ccc; }
.card { border: 1px solid #e5e7eb; border-radius: 10px; padding: 1rem; margin-bottom: 1rem; }
.label { font-size: 11px; color: #888; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
.problem-text { font-size: 15px; line-height: 1.7; min-height: 48px; }
textarea { width: 100%; border: 1px solid #d1d5db; border-radius: 6px; padding: 8px 10px; font-size: 14px; font-family: inherit; background: #fafafa; resize: vertical; margin-top: 10px; min-height: 80px; }
.btn-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
button { font-size: 13px; padding: 7px 14px; border-radius: 6px; border: 1px solid #d1d5db; background: #fff; cursor: pointer; }
button:hover { background: #f3f4f6; }
button.primary { background: #eff6ff; color: #1d4ed8; border-color: #93c5fd; }
button:disabled { opacity: 0.5; cursor: default; }
.feedback { margin-top: 10px; padding: 10px 12px; border-radius: 8px; font-size: 14px; line-height: 1.6; border: 1px solid #e5e7eb; background: #f9fafb; display: none; white-space: pre-wrap; }
.feedback.show { display: block; }
.spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid #ddd; border-top-color: #1d4ed8; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: -2px; margin-right: 5px; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="topic-bar" id="topics">
  <span class="chip active" data-topic="тэгш ба сондгой функц">Тэгш/сондгой</span>
  <span class="chip" data-topic="монотон функц">Монотон</span>
  <span class="chip" data-topic="зааглагдсан функц">Зааглагдсан</span>
  <span class="chip" data-topic="олон гишүүнт функц">Олон гишүүнт</span>
  <span class="chip" data-topic="тригонометр функц">Тригонометр</span>
  <span class="chip" data-topic="урвуу тригонометр функц">Урвуу триг</span>
  <span class="chip" data-topic="илтгэгч ба логарифм функц">Илтгэгч/лог</span>
  <span class="chip" data-topic="дараалал ба прогресс">Дараалал</span>
</div>

<div class="diff-row">
  <span>Түвшин:</span>
  <select id="diff">
    <option value="энгийн">Энгийн</option>
    <option value="дунд" selected>Дунд</option>
    <option value="хэцүү">Хэцүү</option>
  </select>
</div>

<div class="card">
  <div class="label">Бодлого</div>
  <div class="problem-text" id="problem-text">Сэдэв сонгоод "Бодлого үүсгэх" товчийг дарна уу.</div>
  <textarea id="answer" placeholder="Энд хариултаа бичнэ үү..."></textarea>
  <div class="btn-row">
    <button class="primary" id="gen-btn" onclick="generate()">Бодлого үүсгэх</button>
    <button id="check-btn" onclick="checkAnswer()" disabled>Хариул шалгах</button>
    <button onclick="generate()">Дараагийн бодлого</button>
  </div>
  <div class="feedback" id="feedback"></div>
</div>

<script>
let currentProblem = '';
let currentTopic = 'тэгш ба сондгой функц';

document.querySelectorAll('.chip').forEach(c => {
  c.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
    c.classList.add('active');
    currentTopic = c.dataset.topic;
    reset();
  });
});

function reset() {
  document.getElementById('feedback').classList.remove('show');
  document.getElementById('answer').value = '';
  document.getElementById('check-btn').disabled = true;
  document.getElementById('problem-text').textContent = '"Бодлого үүсгэх" товчийг дарна уу.';
}

async function callClaude(messages, system) {
  const res = await fetch('https://math1-proxy.num-math1v.workers.dev/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      system,
      messages
    })
  });
  const data = await res.json();
  return data.content[0].text;
}

async function generate() {
  const diff = document.getElementById('diff').value;
  const btn = document.getElementById('gen-btn');
  const problemEl = document.getElementById('problem-text');
  const fb = document.getElementById('feedback');

  btn.innerHTML = '<span class="spinner"></span>Үүсгэж байна...';
  btn.disabled = true;
  fb.classList.remove('show');
  document.getElementById('answer').value = '';
  document.getElementById('check-btn').disabled = true;

  try {
    const text = await callClaude(
      [{ role: 'user', content: `"${currentTopic}" сэдвээр нэг бодлого үүсгэ.` }],
      `Та Монгол Улсын их сургуулийн Математик Анализ I хичээлийн бодлого үүсгэгч.
Зөвхөн нэг тодорхой тооны бодлого өг. Хариулт бүү өг.
Математик томьёог тодорхой бич (LaTeX биш, энгийн текстээр).
Бодлого нь ${diff} түвшний байна. Монгол хэлээр бич.`
    );
    currentProblem = text.trim();
    problemEl.textContent = currentProblem;
    document.getElementById('check-btn').disabled = false;
  } catch(e) {
    problemEl.textContent = 'Алдаа гарлаа. Дахин оролдоно уу.';
  }
  btn.innerHTML = 'Бодлого үүсгэх';
  btn.disabled = false;
}

async function checkAnswer() {
  const answer = document.getElementById('answer').value.trim();
  if (!answer) { alert('Эхлээд хариултаа бичнэ үү.'); return; }
  const btn = document.getElementById('check-btn');
  const fb = document.getElementById('feedback');

  btn.innerHTML = '<span class="spinner"></span>Шалгаж байна...';
  btn.disabled = true;
  fb.classList.remove('show');

  try {
    const text = await callClaude(
      [{ role: 'user', content: `Бодлого: ${currentProblem}\n\nОюутны хариулт: ${answer}` }],
      `Та математикийн багш. Оюутны хариултыг шалгаад дараах бүтцээр тайлбарла:
1. Зөв эсэх (Зөв / Хэсэгчлэн зөв / Буруу)
2. Зөв шийдийг алхам алхмаар харуул
3. Оюутны алдааг тайлбарла (байвал)
Монгол хэлээр, урамшуулах аялгуутай бай.`
    );
    fb.textContent = text;
    fb.classList.add('show');
  } catch(e) {
    fb.textContent = 'Алдаа гарлаа.';
    fb.classList.add('show');
  }
  btn.innerHTML = 'Хариул шалгах';
  btn.disabled = false;
}
</script>
</body>
</html>
